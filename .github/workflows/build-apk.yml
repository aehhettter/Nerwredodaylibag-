name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Erlaubt manuelles Starten über die GitHub-Oberfläche/Agenten

jobs:
  build:
    name: Build APK with Buildozer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Buildozer
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk libffi-dev libssl-dev
          pip install --upgrade buildozer cython

      - name: Build APK
        run: |
          # Automatisches Erstellen der spec-Datei, falls nicht im Repo
          if [ ! -f "buildozer.spec" ]; then
            buildozer init
            sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec
          fi
          
          # Buildozer im Non-Interactive-Modus ausführen
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chainmidimix-debug-apk
          path: bin/*.apk
